# Refreshes the "Most used languages" block in README.md once a day (and on demand).
# It commits to main only when the numbers changed; no other branch is used.
name: languages

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Count languages in public repositories
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 stats/languages.py

      - name: Commit if changed
        run: |
          git add README.md
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Update most used languages"
          git push -q origin HEAD:main
